name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Erlang and Elixir exactly as in .tool-versions.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix credo --strict
        env:
          MIX_ENV: test
      - run: mix test
      - run: mix docs
        env:
          MIX_ENV: dev
      - run: mix dialyzer
        env:
          MIX_ENV: dev

  # The oldest Elixir that mix.exs accepts (~> 1.18, for the built-in JSON
  # module). OTP 27.2.2, not 27.2: before it, public_key refused a CA
  # certificate of builds.hex.pm's chain, so setup-beam could not install
  # Rebar or Hex (as in Hakushi).
  test-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.18.3"
          otp-version: "27.2.2"
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-oldest-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - run: mix test
